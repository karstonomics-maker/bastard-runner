<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BASTARD RUNNER</title>
  <meta name="description" content="A running blog by someone who probably shouldn't be running.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>

    /* ─── TOKENS ─────────────────────────────────────────── */
    :root {
      --bg:           #070707;
      --surface:      #121212;
      --surface-2:    #1a1a1a;
      --border:       #222222;
      --red:          #DC2626;
      --red-dark:     #991B1B;
      --text:         #F0EDE6;
      --muted:        #666666;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'Inter', sans-serif;
      --max-w:        1200px;
      --pad:          clamp(1rem, 4vw, 3rem);
    }

    /* ─── RESET ──────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 300;
      line-height: 1.6;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* ─── TICKER ─────────────────────────────────────────── */
    .ticker {
      background: var(--red);
      padding: 0.5rem 0;
      overflow: hidden;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .ticker-track {
      display: flex;
      white-space: nowrap;
      animation: scroll-ticker 40s linear infinite;
    }
    .ticker-track:hover { animation-play-state: paused; }
    .ticker-item {
      font-family: var(--font-display);
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      color: #fff;
      padding: 0 2.5rem;
      flex-shrink: 0;
    }
    .ticker-sep {
      color: rgba(255,255,255,0.4);
      padding: 0;
      margin: 0;
    }
    @keyframes scroll-ticker {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* ─── NAV ────────────────────────────────────────────── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem var(--pad);
      max-width: var(--max-w);
      margin: 0 auto;
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      color: var(--text);
    }
    .nav-logo span { color: var(--red); }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }
    .nav-links a {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-social {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .nav-social a {
      color: var(--muted);
      transition: color 0.2s;
      display: flex;
    }
    .nav-social a:hover { color: var(--red); }
    .nav-social svg { width: 18px; height: 18px; fill: currentColor; }

    /* ─── HERO ───────────────────────────────────────────── */
    .hero {
      padding: clamp(3rem, 8vw, 7rem) var(--pad) clamp(3rem, 6vw, 5rem);
      max-width: var(--max-w);
      margin: 0 auto;
      border-bottom: 1px solid var(--border);
    }
    .hero-eyebrow {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 1.5rem;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(5rem, 16vw, 14rem);
      line-height: 0.88;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 2.5rem;
    }
    .hero-title em {
      font-style: normal;
      color: var(--red);
    }
    .hero-sub {
      max-width: 480px;
      font-size: 1rem;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--red);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.9rem 1.8rem;
      transition: background 0.2s;
    }
    .hero-cta:hover { background: var(--red-dark); }

    /* ─── SECTION HEADERS ────────────────────────────────── */
    .section {
      padding: clamp(3rem, 6vw, 5rem) var(--pad);
      max-width: var(--max-w);
      margin: 0 auto;
    }
    .section-label {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .section-label h2 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 3rem);
      letter-spacing: 0.04em;
      color: var(--text);
    }
    .section-label-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .section-count {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: var(--muted);
    }

    /* ─── FEATURED VIDEO ─────────────────────────────────── */
    .featured-video {
      border-bottom: 1px solid var(--border);
    }
    .featured-inner {
      padding: clamp(3rem, 6vw, 5rem) var(--pad);
      max-width: var(--max-w);
      margin: 0 auto;
    }
    .featured-embed {
      position: relative;
      aspect-ratio: 16 / 9;
      background: var(--surface);
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .featured-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .featured-embed .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .featured-embed .placeholder svg {
      width: 48px; height: 48px; fill: var(--border);
    }
    .featured-meta {
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .featured-tag {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red);
    }
    .featured-title {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      letter-spacing: 0.03em;
      color: var(--text);
    }
    .featured-desc {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--muted);
      max-width: 620px;
    }

    /* ─── VIDEO GRID ─────────────────────────────────────── */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
      gap: 2px;
    }
    .video-card {
      background: var(--surface);
      overflow: hidden;
    }
    .video-card-embed {
      position: relative;
      aspect-ratio: 16 / 9;
      background: var(--surface-2);
    }
    .video-card-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .video-card-embed .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border);
    }
    .video-card-embed .placeholder svg { width: 36px; height: 36px; fill: currentColor; }
    .video-card-info {
      padding: 1rem 1.2rem 1.3rem;
    }
    .video-card-num {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .video-card-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 0.4rem;
    }
    .video-card-desc {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ─── DISPATCHES ─────────────────────────────────────── */
    .dispatches {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .dispatch-list {
      display: flex;
      flex-direction: column;
    }
    .dispatch-item {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 2rem;
      padding: 1.8rem 0;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }
    .dispatch-item:last-child { border-bottom: none; }
    .dispatch-date {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding-top: 0.2rem;
    }
    .dispatch-text {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.7;
      font-weight: 300;
    }
    .dispatch-text strong {
      color: var(--red);
      font-weight: 500;
    }

    /* ─── ABOUT ──────────────────────────────────────────── */
    .about-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }
    .about-text {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.8;
    }
    .about-text p + p { margin-top: 1rem; }
    .about-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
    }
    .stat-card {
      background: var(--surface);
      padding: 1.5rem;
    }
    .stat-num {
      font-family: var(--font-display);
      font-size: 2.5rem;
      letter-spacing: 0.02em;
      color: var(--text);
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .stat-num span { color: var(--red); }
    .stat-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ─── FOOTER ─────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem var(--pad);
    }
    .footer-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .footer-logo {
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .footer-logo span { color: var(--red); }
    .footer-social {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    .footer-social a {
      color: var(--muted);
      display: flex;
      transition: color 0.2s;
    }
    .footer-social a:hover { color: var(--red); }
    .footer-social svg { width: 18px; height: 18px; fill: currentColor; }
    .footer-copy {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      width: 100%;
    }

    /* ─── MANIFESTO ─────────────────────────────────────── */
    .manifesto {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .manifesto-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: clamp(3rem, 7vw, 6rem) var(--pad);
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 4rem;
      align-items: start;
    }
    .manifesto-label {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 5rem);
      letter-spacing: 0.03em;
      color: var(--text);
      line-height: 0.95;
      position: sticky;
      top: 4rem;
    }
    .manifesto-label span { color: var(--red); display: block; }
    .manifesto-body {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .manifesto-body p {
      font-size: clamp(1rem, 1.5vw, 1.15rem);
      font-weight: 300;
      color: var(--muted);
      line-height: 1.85;
    }
    .manifesto-body p strong {
      color: var(--text);
      font-weight: 500;
    }
    .manifesto-body p em {
      color: var(--red);
      font-style: normal;
    }
    .manifesto-pull {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 3.5vw, 3rem);
      letter-spacing: 0.03em;
      color: var(--text);
      line-height: 1.05;
      border-left: 3px solid var(--red);
      padding-left: 1.5rem;
      margin: 1rem 0;
    }

    /* ─── CREDENTIALS ────────────────────────────────────── */
    .credentials {
      border-bottom: 1px solid var(--border);
    }
    .cred-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2px;
      margin-top: 0;
    }
    .cred-card {
      background: var(--surface);
      padding: 2rem 1.8rem;
      border-top: 3px solid transparent;
      transition: border-color 0.2s;
    }
    .cred-card:hover { border-color: var(--red); }
    .cred-icon {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .cred-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .cred-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .cred-caveat {
      font-size: 0.7rem;
      color: var(--red);
      margin-top: 0.5rem;
      font-style: italic;
    }

    /* ─── PROMISE ────────────────────────────────────────── */
    .promise {
      border-bottom: 1px solid var(--border);
      background: var(--red);
    }
    .promise-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: clamp(3rem, 6vw, 5rem) var(--pad);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
    }
    .promise-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      letter-spacing: 0.02em;
      color: #fff;
      line-height: 0.95;
    }
    .promise-body {
      color: rgba(255,255,255,0.8);
      font-size: 0.95rem;
      line-height: 1.8;
      font-weight: 300;
    }
    .promise-body strong { color: #fff; font-weight: 600; }
    .promise-steps {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      list-style: none;
    }
    .promise-steps li {
      display: flex;
      gap: 1rem;
      align-items: baseline;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.75);
    }
    .promise-steps li span {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: #fff;
      flex-shrink: 0;
    }

    /* ─── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 700px) {
      .nav-links { display: none; }
      .about-inner { grid-template-columns: 1fr; gap: 2.5rem; }
      .dispatch-item { grid-template-columns: 1fr; gap: 0.4rem; }
      .manifesto-inner { grid-template-columns: 1fr; gap: 2rem; }
      .manifesto-label { position: static; }
      .promise-inner { grid-template-columns: 1fr; }
    }

  </style>
</head>
<body>

<!-- ░░░ TICKER ░░░ -->

<!-- ░░░ VIDEO ARCHIVE ░░░ -->

</section>

<!-- ░░░ DISPATCHES ░░░ -->
<section class="dispatches" id="dispatches">
  <div class="section">
    <div class="section-label">

      <div class="section-label-line"></div>

</section>

<!-- ░░░ ABOUT ░░░ -->
<section class="section" id="about" style="border-bottom:1px solid var(--border);">

    <h2>ABOUT</h2>

  <div class="about-inner">

<!-- ░░░ FOOTER ░░░ -->
<footer>
  <div class="footer-inner">

function buildSocialLinks(container) {
  Object.entries(CONTENT.social).forEach(([platform, url]) => {
    if (!url) return;
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = platform;
    a.innerHTML = ICONS[platform] || '';
    container.appendChild(a);
  });
}

function buildTicker() {
  const items = [...CONTENT.ticker, ...CONTENT.ticker]; // duplicate for seamless loop
  const track = document.getElementById('ticker-track');
  items.forEach((text, i) => {
    const span = document.createElement('span');
    span.className = 'ticker-item';
    span.textContent = text;
    track.appendChild(span);
    const sep = document.createElement('span');
    sep.className = 'ticker-item ticker-sep';
    sep.textContent = '·';
    track.appendChild(sep);
  });
}

function videoEmbed(id, placeholder = true) {
  if (id) {
    return `<iframe src="https://www.youtube.com/embed/${id}" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen loading="lazy"></iframe>`;
  }
  return `<div class="placeholder">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <span>Add your YouTube video ID</span>
  </div>`;
}

function buildFeatured() {
  const v = CONTENT.videos[0];
  if (!v) return;
  document.getElementById('featured-embed').innerHTML = videoEmbed(v.id);
  document.getElementById('featured-meta').innerHTML = `
    <div class="featured-meta">
      <span class="featured-tag">Latest Episode</span>
      <div>
        <div class="featured-title">${v.title}</div>
        <div class="featured-desc">${v.description}</div>
      </div>
    </div>`;
}

function buildArchive() {
  const archive = CONTENT.videos.slice(1);
  document.getElementById('video-count').textContent = `${archive.length} episodes`;
  const grid = document.getElementById('video-grid');
  archive.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'video-card';
    card.innerHTML = `
      <div class="video-card-embed">${videoEmbed(v.id)}</div>
      <div class="video-card-info">
        <div class="video-card-num">${v.episode || `EP. ${String(i + 2).padStart(2, '0')}`}</div>
        <div class="video-card-title">${v.title}</div>
        <div class="video-card-desc">${v.description}</div>
      </div>`;
    grid.appendChild(card);
  });
}

function buildDispatches() {
  const list = document.getElementById('dispatch-list');
  CONTENT.dispatches.forEach(d => {
    const item = document.createElement('div');
    item.className = 'dispatch-item';
    item.innerHTML = `<div class="dispatch-date">${d.date}</div><div class="dispatch-text">${d.text}</div>`;
    list.appendChild(item);
  });
}

function buildAbout() {
  const { paragraphs, stats } = CONTENT.about;
  document.getElementById('about-text').innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');
  const statsEl = document.getElementById('about-stats');
  stats.forEach(s => {
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = `
      <div class="stat-num">${s.num}<span>${s.unit}</span></div>
      <div class="stat-label">${s.label}</div>`;
    statsEl.appendChild(card);
  });
}

function buildSocial() {
  buildSocialLinks(document.getElementById('nav-social'));
  buildSocialLinks(document.getElementById('footer-social'));
}

function buildFooter() {
  document.getElementById('footer-copy').textContent =
    `© ${new Date().getFullYear()} Bastard Runner. All excuses reserved.`;
}

function buildManifesto() {
  const { paragraphs, pullQuote } = CONTENT.manifesto;
  const el = document.getElementById('manifesto-body');
  paragraphs.forEach((p, i) => {
    if (i === 1) {
      const pull = document.createElement('blockquote');
      pull.className = 'manifesto-pull';
      pull.textContent = pullQuote;
      el.appendChild(pull);
    }
    const para = document.createElement('p');
    para.innerHTML = p;
    el.appendChild(para);
  });
}

function buildCredentials() {
  const grid = document.getElementById('cred-grid');
  CONTENT.credentials.forEach(c => {
    const card = document.createElement('div');
    card.className = 'cred-card';
    card.innerHTML = `
      <div class="cred-icon">${c.icon}</div>
      <div class="cred-title">${c.title}</div>
      <div class="cred-desc">${c.desc}</div>
      <div class="cred-caveat">${c.caveat}</div>`;
    grid.appendChild(card);
  });
}

function buildPromise() {
  const { title, steps, caveat } = CONTENT.promise;
  document.getElementById('promise-inner').innerHTML = `
    <div class="promise-title">${title}</div>
    <div class="promise-body">
      <ul class="promise-steps">
        ${steps.map(s => `<li><span>${s.num}</span>${s.text}</li>`).join('')}
      </ul>
      <p style="margin-top:1.5rem;font-size:0.78rem;opacity:0.6;font-style:italic;">${caveat}</p>
    </div>`;
}


buildTicker();
buildManifesto();
buildCredentials();
buildPromise();
buildFeatured();
buildArchive();
buildDispatches();
buildAbout();
buildSocial();
buildFooter();

</script>
